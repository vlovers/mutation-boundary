name: MutationBoundary checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mutation_boundary_test
          POSTGRES_USER: mutation_boundary_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mutation_boundary_ci -d mutation_boundary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MUTATION_BOUNDARY_TEST_DATABASE_URL: postgresql://mutation_boundary_ci:ci_only_password@127.0.0.1:5432/mutation_boundary_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate dependency lockfile
        run: |
          test -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
      - name: Install pinned integration consumer dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typeorm@0.3.27 @nestjs/common@11.1.6 @nestjs/core@11.1.6 reflect-metadata@0.2.2 rxjs@7.8.2 jest@30.2.0 @jest/globals@30.2.0 vitest@3.2.4
      - name: Verify TypeORM and NestJS against disposable PostgreSQL
        run: node --experimental-strip-types --test test/typeorm-nestjs.test.mjs
      - run: npm run build
      - name: Run Jest ESM consumer checks
        env:
          NODE_OPTIONS: --experimental-vm-modules --experimental-strip-types
        run: npx --no-install jest --runInBand --runTestsByPath test/runners/jest.test.mjs --testMatch '**/*.test.mjs'
      - name: Run Vitest ESM consumer checks
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npx --no-install vitest run test/runners/vitest.test.mjs
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm run test:consumer
      - name: Validate published npm 0.2.0 in a clean consumer
        run: npm run test:registry -- mutation-boundary@0.2.0
      - run: node --input-type=module -e "import('./dist/index.js').then(m => { if (typeof m.assertNoMutation !== 'function') process.exit(1) })"
